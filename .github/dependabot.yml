# Version updates: minor and patch releases are grouped into one weekly PR
# per package. Major upgrades (Vuetify, Vue Router, Node, ESLint, …) change
# APIs and are planned by hand, so they are not proposed automatically.
# Security updates are not affected by these rules and always arrive.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
    ignore:
      # Stay on the Node LTS line; move to the next LTS deliberately.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
