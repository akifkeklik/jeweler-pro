name: Backend CI

on:
  push:
    branches: [main, improve/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/jeweler_ci?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MongoDB replica set
        run: |
          docker run -d --name jeweler-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec jeweler-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec jeweler-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in $(seq 1 20); do
            if docker exec jeweler-mongo mongosh --quiet --eval 'rs.status().ok' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become ready" >&2
          docker logs jeweler-mongo
          exit 1
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
