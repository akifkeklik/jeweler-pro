name: Backend CI

on:
  push:
    branches: [main, improve/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/jeweler_ci?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Initialize MongoDB replica set
        run: |
          MONGO_CONTAINER="$(docker ps -q --filter ancestor=mongo:7 | head -n 1)"
          test -n "$MONGO_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}] }).ok }'
          for attempt in $(seq 1 20); do
            if docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'rs.status().ok' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become ready" >&2
          exit 1
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
