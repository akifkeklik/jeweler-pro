name: CI

# Every pull request and every push to main runs every gate; a red gate
# blocks the merge (the main ruleset requires these checks). Feature-branch
# pushes are covered by their pull request, so they do not run twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ESLint (frontend + backend)
        run: npm run lint
      - name: Type check (vue-tsc)
        run: npm run typecheck
      - name: Locale catalogs are up to date
        run: node scripts/build-locales.mjs --check

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit and component tests with coverage thresholds (vitest)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Production build
        run: npm run build

  backend:
    name: Backend tests (real MongoDB replica set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run tests with coverage thresholds
        working-directory: backend
        # scripts/runTests.js starts a throw-away replica set (mongodb-memory-server).
        run: npm run test:coverage | tee coverage.txt
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'all files|line %' coverage.txt | head -2 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end, visual and accessibility QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Auth and POS scenarios (Playwright, real API and database)
        run: npm run test:e2e
      - name: Transfer, settlement and purchase-return scenarios
        run: npm run test:e2e:ops
      - name: Visual QA, phone layouts and accessibility (axe-core, WCAG 2.1 AA)
        run: npm run test:e2e:visual
        env:
          QA_OUT: ${{ runner.temp }}/visual-qa
      - name: Upload QA screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-qa
          path: ${{ runner.temp }}/visual-qa
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Frontend runtime dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Backend runtime dependencies (high and above)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: API image
        run: docker build -t jeweler-pro-api:ci backend
      - name: Web image
        run: docker build -t jeweler-pro-web:ci .
